modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "lifeessentials"
version = "${version}"
displayName = "Life Essentials"
description = '''Adds an iPhone to Minecraft: control your real Spotify / Apple Music, text other phones, wear AirPods, and play mp3s, web links and YouTube out of a JBL speaker everyone nearby can hear.'''
authors = "Rafael Ribeiro"
logoFile = "assets/lifeessentials/icon.png"

[[mixins]]
config = "lifeessentials.mixins.json"

[[dependencies.lifeessentials]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.lifeessentials]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"
